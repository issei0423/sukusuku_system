name: Claude（@claude で呼ぶ）

# Issue や PR のコメントに @claude と書くと Claude が返事をする。
# 読み取り専用: このジョブのトークンを contents: read にしているので、
# Claude はどのブランチにも push できない（GitHub 側で止まる）。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 15     # 止まらなくなっても 15 分で打ち切る（使用枠の守り）
    permissions:
      contents: read        # push できない（読み取り専用の本体）
      pull-requests: write  # PR にコメントするため
      issues: write         # Issue にコメントするため
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # サブスクのトークン（claude setup-token で作ったもの）
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub App ではなく、このジョブの読み取り専用トークンを使う
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
            --append-system-prompt "このリポジトリでは読み取り専用で動く。ファイルの変更・commit・push はしない（権限がないので失敗する）。直し方を提案するときは、コメントの中にコードブロックで示す。返事は日本語で書く。"
