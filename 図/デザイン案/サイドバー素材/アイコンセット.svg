<svg xmlns="http://www.w3.org/2000/svg" width="720" height="376" viewBox="0 0 720 376" role="img" aria-labelledby="title desc">
  <title id="title">すくすく・サイドバー用アイコン案</title>
  <desc id="desc">職員用メニューの機能名に対応する、同じ線幅の13個のアイコン。意味は文字のラベルと併用する。</desc>
  <defs>
    <symbol id="dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="diary" viewBox="0 0 24 24"><path d="M12 5c-2.7-1.6-5.6-1.7-9-1v14c3.4-.7 6.3-.6 9 1 2.7-1.6 5.6-1.7 9-1V4c-3.4-.7-6.3-.6-9 1Z"/><path d="M12 5v14M5.5 8.5c1.5-.1 2.7.1 4 .6m5-.6c1.2-.5 2.5-.7 4-.6"/></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M20 11.5c0 4.4-3.6 7.5-8 7.5-1.2 0-2.5-.2-3.5-.7L4 20l1.1-4C4.4 14.8 4 13.2 4 11.5 4 7.1 7.6 4 12 4s8 3.1 8 7.5Z"/><path d="M8.5 11.5h7"/></symbol>
    <symbol id="nap" viewBox="0 0 24 24"><path d="M17.7 17.5A8.5 8.5 0 0 1 6.5 6.3a8.5 8.5 0 1 0 11.2 11.2Z"/><path d="M17.5 5.5v5m-2.5-2.5h5"/></symbol>
    <symbol id="growth" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 7h5M5 11h3m-3 4h5m-5 4h3"/></symbol>
    <symbol id="children" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3.5 20v-2.2c0-3 2.4-5.3 5.5-5.3s5.5 2.3 5.5 5.3V20Zm12 0H21v-1.6c0-2.4-1.6-4.3-4-4.6"/></symbol>
    <symbol id="approval" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6Z"/><path d="M15 3v4h3M9 13l2 2 4-4"/></symbol>
    <symbol id="staff" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3"/><path d="M4 20v-2a6 6 0 0 1 12 0v2Zm14-13h4m-2-2v4"/></symbol>
    <symbol id="invitation" viewBox="0 0 24 24"><path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4Z"/><path d="M12 6v2m0 3v2m0 3v2"/></symbol>
    <symbol id="guardians" viewBox="0 0 24 24"><circle cx="8" cy="8" r="2.5"/><circle cx="16" cy="8" r="2.5"/><path d="M2.5 20v-2c0-2.7 2.1-4.7 5.5-4.7s5.5 2 5.5 4.7v2Zm9 0h10v-2c0-2.7-2.1-4.7-5.5-4.7-1.4 0-2.7.4-3.6 1.2"/></symbol>
    <symbol id="fiscal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4m-8 7h3m3 0h3m-9 3h3"/></symbol>
    <symbol id="logs" viewBox="0 0 24 24"><path d="M4 4h16v16H4Z"/><path d="M8 9h8m-8 4h8m-8 4h5"/></symbol>
    <symbol id="misdelivery" viewBox="0 0 24 24"><path d="M4 5h11l4 4v11H4Z"/><path d="M15 5v5h4M13 13c-2.6 0-4.5 1.5-4.5 4M8.5 17l-2-2m2 2 2-2"/></symbol>
  </defs>
  <rect width="720" height="376" fill="#fffdf7"/>
  <text x="30" y="40" font-family="Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="700" fill="#302a22">職員用メニューのアイコン案</text>
  <text x="30" y="65" font-family="Yu Gothic, Meiryo, sans-serif" font-size="13" fill="#6d665a">色や表情で状態を判定しない、20px の線画。文字と一緒に使う。</text>
  <g fill="none" stroke="#745926" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <use href="#dashboard" x="32" y="90" width="24" height="24"/><use href="#diary" x="262" y="90" width="24" height="24"/><use href="#chat" x="492" y="90" width="24" height="24"/>
    <use href="#nap" x="32" y="146" width="24" height="24"/><use href="#growth" x="262" y="146" width="24" height="24"/><use href="#children" x="492" y="146" width="24" height="24"/>
    <use href="#approval" x="32" y="202" width="24" height="24"/><use href="#staff" x="262" y="202" width="24" height="24"/><use href="#invitation" x="492" y="202" width="24" height="24"/>
    <use href="#guardians" x="32" y="258" width="24" height="24"/><use href="#fiscal" x="262" y="258" width="24" height="24"/><use href="#logs" x="492" y="258" width="24" height="24"/>
    <use href="#misdelivery" x="32" y="314" width="24" height="24"/>
  </g>
  <g font-family="Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#302a22">
    <text x="66" y="109">ダッシュボード</text><text x="296" y="109">日誌</text><text x="526" y="109">チャット</text>
    <text x="66" y="165">午睡チェック</text><text x="296" y="165">発達・身体</text><text x="526" y="165">園児</text>
    <text x="66" y="221">承認待ち</text><text x="296" y="221">職員アカウント</text><text x="526" y="221">招待コード</text>
    <text x="66" y="277">保護者アカウント</text><text x="296" y="277">年度更新</text><text x="526" y="277">操作ログ</text>
    <text x="66" y="333">誤送信対応</text>
  </g>
</svg>
