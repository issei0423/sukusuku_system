<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" role="img" aria-labelledby="title desc">
  <title id="title">職員ダッシュボードの改訂デザイン案</title>
  <desc id="desc">未対応の仕事を行として一覧にし、右側によく使う操作を置いた職員向け画面。装飾を減らし、黄色を案内と現在地に限定している。</desc>
  <style>
    text { font-family: "Yu Gothic", "Meiryo", sans-serif; fill: #263238; }
    .minor { font-size: 14px; fill: #637078; }
    .nav { font-size: 16px; }
    .row { font-size: 18px; }
  </style>
  <rect width="1180" height="820" fill="#f8f7f3"/>
  <rect width="1180" height="6" fill="#f3d16b"/>
  <rect x="0" y="6" width="1180" height="62" fill="#fff"/>
  <path d="M0 68H1180" stroke="#dddcd5"/>
  <circle cx="31" cy="37" r="5" fill="#d0a82c"/>
  <circle cx="60" cy="37" r="5" fill="#d0a82c"/>
  <path d="M36 37H55" stroke="#d0a82c" stroke-width="2"/>
