  <path d="M222 183H1145" stroke="#d3d2ca"/>
  <text x="222" y="232" font-size="20" font-weight="700">未対応</text>
  <text x="223" y="261" class="minor">確認が必要なものを、ここから開けます。</text>
  <rect x="222" y="286" width="608" height="292" fill="#fff" stroke="#d9d9d1"/>
  <rect x="222" y="286" width="4" height="292" fill="#f3d16b"/>
  <path d="M246 358H805M246 431H805M246 504H805" stroke="#e7e5dd"/>
  <text x="248" y="333" class="row">差し戻された日誌</text>
  <text x="651" y="333" class="row" font-weight="700">2件</text>
  <text x="738" y="333" font-size="15" text-decoration="underline">開く →</text>
  <text x="248" y="407" class="row">未読のチャット</text>
  <text x="651" y="407" class="row" font-weight="700">1件</text>
  <text x="738" y="407" font-size="15" text-decoration="underline">開く →</text>
  <text x="248" y="479" class="row">発達チェック未入力</text>
  <text x="651" y="479" class="row">0人</text>
  <text x="738" y="479" font-size="15" text-decoration="underline">開く →</text>
  <text x="248" y="551" class="row">承認待ち</text>
  <text x="651" y="551" class="row">0件</text>
  <text x="738" y="551" font-size="15" text-decoration="underline">開く →</text>
  <text x="868" y="232" font-size="20" font-weight="700">よく使う</text>
