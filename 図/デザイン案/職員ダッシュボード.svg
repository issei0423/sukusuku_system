  <text x="968" y="43" class="minor">ひよこ組</text>
  <text x="1083" y="43" font-size="14" text-decoration="underline">ログアウト</text>
  <rect x="0" y="69" width="188" height="751" fill="#fff"/>
  <path d="M188 69V820" stroke="#dddcd5"/>
  <text x="24" y="113" class="minor">メニュー</text>
  <rect x="0" y="135" width="4" height="48" fill="#d0a82c"/>
  <text x="25" y="166" class="nav" font-weight="700">ダッシュボード</text>
  <text x="25" y="222" class="nav">日誌</text>
  <text x="25" y="270" class="nav">チャット</text>
  <text x="25" y="318" class="nav">午睡チェック</text>
  <text x="25" y="366" class="nav">発達・身体</text>
  <text x="25" y="414" class="nav">園児</text>
