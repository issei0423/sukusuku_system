<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">保護者ホームの改訂デザイン案</title>
  <desc id="desc">園児ごとの情報を連絡帳のように縦に読み、連絡と共有された記録へ進める保護者向け画面。均等なカードや飾りの絵を使わない。</desc>
  <style>
    text { font-family: "Yu Gothic", "Meiryo", sans-serif; fill: #263238; }
    .minor { font-size: 12px; fill: #637078; }
    .section { font-size: 17px; font-weight: 700; }
  </style>
  <rect width="390" height="844" fill="#fffefa"/>
  <rect width="390" height="5" fill="#f3d16b"/>
  <rect x="0" y="5" width="390" height="57" fill="#fff"/>
  <path d="M0 62H390" stroke="#dddcd5"/>
  <path d="M19 25H40M19 32H40M19 39H40" stroke="#263238" stroke-width="2" stroke-linecap="round"/>
  <circle cx="69" cy="33" r="4" fill="#d0a82c"/>
  <circle cx="87" cy="33" r="4" fill="#d0a82c"/>
  <path d="M73 33H83" stroke="#d0a82c" stroke-width="2"/>
  <text x="99" y="39" font-size="16" font-weight="700">すくすく保育園</text>
  <text x="328" y="38" font-size="12">通知 <tspan font-weight="700">2</tspan></text>
  <text x="20" y="91" class="minor">ひよこ組  ·  2歳3か月</text>
  <rect x="20" y="104" width="4" height="40" fill="#f3d16b"/>
  <text x="34" y="135" font-size="27" font-weight="700">はるちゃん</text>
  <text x="20" y="179" class="section">新しいお知らせ</text>
  <path d="M20 193H370" stroke="#cfd2cf"/>
  <text x="20" y="223" font-size="15">園からのお知らせ</text>
  <text x="310" y="223" font-size="14" font-weight="700">未読 1</text>
  <path d="M20 242H370" stroke="#e5e6e1"/>
  <text x="20" y="271" font-size="15">先生とのやりとり</text>
  <text x="310" y="271" font-size="14" font-weight="700">未読 1</text>
  <path d="M20 290H370" stroke="#e5e6e1"/>
  <rect x="20" y="307" width="350" height="50" fill="#f3d16b"/>
  <text x="130" y="339" font-size="16" font-weight="700">チャットを開く →</text>
  <text x="20" y="399" class="section">最近の記録</text>
  <path d="M20 413H370" stroke="#cfd2cf"/>
  <text x="20" y="442" class="minor">10月4日（日）</text>
  <text x="130" y="442" font-size="15" font-weight="700">個人日誌</text>
  <text x="130" y="469" font-size="14">園での活動の様子を</text>
  <text x="130" y="489" font-size="14">記録しました。</text>
  <text x="130" y="521" font-size="14" text-decoration="underline">記録を読む →</text>
  <path d="M20 544H370" stroke="#e5e6e1"/>
  <text x="20" y="586" class="minor">うさぎ組  ·  4歳1か月</text>
  <rect x="20" y="599" width="4" height="40" fill="#f3d16b"/>
  <text x="34" y="630" font-size="27" font-weight="700">みおちゃん</text>
  <text x="20" y="671" class="section">新しいお知らせ</text>
  <path d="M20 685H370" stroke="#cfd2cf"/>
  <text x="20" y="716" font-size="14" fill="#637078">新しい連絡はありません</text>
  <rect x="0" y="764" width="390" height="80" fill="#f8f7f3"/>
  <path d="M0 764H390" stroke="#d9d9d1"/>
  <text x="20" y="794" font-size="13" font-weight="700">緊急のご連絡はお電話でお願いします</text>
  <text x="20" y="817" class="minor">通常のご連絡はチャットから</text>
</svg>
