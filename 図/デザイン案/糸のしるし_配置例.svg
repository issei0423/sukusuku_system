<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">糸のしるしの配置例</title>
  <desc id="desc">一本の糸が中央で笑顔の口となるワンポイントの原寸例、サービス名の横に置く例、保護者の記録見出しの下に置く例。</desc>
  <style>
    text { font-family: "Yu Gothic", "Meiryo", sans-serif; fill: #263238; }
    .note { font-size: 15px; fill: #637078; }
  </style>
  <defs>
    <g id="mark">
      <path d="M28 31 C20 23 13 27 16 35 C20 42 30 40 28 31 C45 29 65 31 75 28 C81 27 79 44 95 44 C109 44 108 27 114 28 C130 31 141 34 153 31 C151 25 159 23 164 29 C168 36 160 40 155 36 C152 34 152 32 153 31" fill="none" stroke="#B58C2A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="87" cy="25" r="1.7" fill="#B58C2A"/>
      <circle cx="104" cy="25" r="1.7" fill="#B58C2A"/>
    </g>
  </defs>
  <rect width="900" height="520" fill="#f8f7f3"/>
  <text x="48" y="68" font-size="26" font-weight="700">ワンポイント「糸のしるし」</text>
  <text x="48" y="103" class="note">一本の糸が両端で輪になり、中央では笑顔の口になる。</text>
  <path d="M48 129H852" stroke="#d9d9d1"/>
  <text x="48" y="174" font-size="16" font-weight="700">図案</text>
  <use href="#mark" transform="translate(250 159)"/>
  <text x="470" y="191" class="note">必要な場所にだけ置く小さな印</text>
  <path d="M48 229H852" stroke="#d9d9d1"/>
  <text x="48" y="274" font-size="16" font-weight="700">サービス名の横</text>
  <rect x="282" y="244" width="570" height="76" fill="#fff"/>
  <path d="M282 244H852" stroke="#f3d16b" stroke-width="5"/>
  <use href="#mark" transform="translate(296 261) scale(.7)"/>
  <text x="439" y="293" font-size="22" font-weight="700">すくすく保育園</text>
  <path d="M48 357H852" stroke="#d9d9d1"/>
  <text x="48" y="402" font-size="16" font-weight="700">記録の見出し</text>
  <rect x="282" y="373" width="570" height="112" fill="#fffefa"/>
  <text x="307" y="414" font-size="20" font-weight="700">最近の記録</text>
  <path d="M307 429H826" stroke="#d9d9d1"/>
  <use href="#mark" transform="translate(296 421) scale(.7)"/>
  <text x="439" y="449" class="note">日付と本文を邪魔しない余白に置く</text>
</svg>
